# Every pull request is checked for a signed Contributor License Agreement
# before it can be merged (CONTRIBUTING.md says why). A contributor signs
# once by posting the sentence below as a comment on their pull request;
# the signature is recorded in signatures/cla.json on the cla-signatures
# branch and the check passes for every later pull request from the same
# account. The branch protection rule on main requires this check.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a signed CLA
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA document and I hereby sign the CLA.') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          custom-pr-sign-comment: 'I have read the CLA document and I hereby sign the CLA.'
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be merged, please read the [Contributor License Agreement]($pathToCLADocument) and sign it by posting this sentence as a comment, on its own: **I have read the CLA document and I hereby sign the CLA.**'
          custom-allsigned-prcomment: 'The CLA is signed for everyone on this pull request.'
          lock-pullrequest-aftermerge: false
